<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Endurance Manager</title>
<!--
  L'écran du plugin dans SimHub (maquette validée par Nathan le 22/11/2026, charte du site : styles/tokens.css et
  racing-theme.css). Servi par le plugin sur ce PC (WallServer.cs) ; lit /etat et envoie ses clics à /action (ScreenApi.cs).
  Menu à gauche : Accueil, Pour moi, Avec mon équipe, Assistance. Le menu passe en icônes quand SimHub est étroit.
-->
<style>
:root{
  --bg:#07090a;--panel:rgba(12,17,19,.92);--panel2:rgba(18,25,28,.88);--line:rgba(73,118,123,.52);--line2:rgba(76,129,134,.30);
  --text:#eef3f2;--cream:#f1e3c4;--muted:#91a4a7;--accent:#59d3d8;--ok:#3ecf8e;--warn:#e7b653;--danger:#e4483d;--danger-text:#ff8b82;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14.5px/1.45 Arial,Helvetica,sans-serif;color:var(--text);background-color:var(--bg);
  background-image:linear-gradient(rgba(7,9,10,.80),rgba(7,9,10,.88)),url("tech-pattern.svg"),radial-gradient(circle at 18% 4%,rgba(84,205,211,.10),transparent 26rem),radial-gradient(circle at 82% 18%,rgba(228,72,61,.07),transparent 30rem);
  background-size:auto,720px 480px,auto,auto;background-position:center,40px 10px,center,center;display:flex;flex-direction:column;overflow:hidden}
h1,h2,h3,p{margin:0}
button,input,textarea{font:inherit;color:inherit}
/* The site's banner as a thin band, its title always whole: the picture keeps its proportions (cropped to the
   title's height, bandeau.jpg), left-aligned when the window is narrow, centred with a blurred fill when wide. */
.banner{position:relative;flex:none;height:clamp(56px,8.3vw,120px);overflow:hidden;background:#070a0c}
.banner::before{content:"";position:absolute;inset:-20px;background:url("bandeau.jpg") center/cover;filter:blur(16px) brightness(.5)}
.banner i{position:absolute;top:0;bottom:0;left:max(0px,calc(50% - 6.03 * clamp(56px,8.3vw,120px)));aspect-ratio:2048/170;background:url("bandeau.jpg") center/cover}
.stripes{height:5px;flex:none;display:grid;grid-template-columns:1.35fr .72fr .72fr .55fr}
.stripes i:nth-child(1){background:linear-gradient(90deg,#3bbcc4,#78dce0)}.stripes i:nth-child(2){background:linear-gradient(90deg,#d9433a,#f05b42)}
.stripes i:nth-child(3){background:linear-gradient(90deg,#dfa63e,#efca70)}.stripes i:nth-child(4){background:#1c2427}
.shell{flex:1;display:flex;min-height:0}
nav{flex:none;width:262px;padding:18px 12px;display:flex;flex-direction:column;overflow-y:auto;border-right:1px solid rgba(92,211,216,.26);background:rgba(7,11,13,.72)}
.nv{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:0 10px 0 12px;margin-bottom:2px;border-radius:9px;border:1px solid transparent;background:transparent;color:#dce6e3;font-weight:700;font-size:14px;cursor:pointer;text-align:left;position:relative}
.nv:hover{background:rgba(25,37,40,.8)}
.nv[aria-current="page"]{background:linear-gradient(180deg,#1f5f64,#17484d);border-color:rgba(91,213,218,.72);color:#eaffff;box-shadow:inset 0 1px rgba(255,255,255,.09)}
.nv svg{flex:none}.nv .lb{flex:1}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:#3a4044}.dot.on{background:var(--ok)}
.grp{font:700 11.5px Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:18px 12px 6px}
.sep{display:none;height:1px;background:var(--line);margin:10px 8px}
.ver{margin-top:auto;padding:18px 12px 4px;font-size:12px;color:var(--muted)}
main{flex:1;min-width:0;overflow-y:auto;padding:26px 30px 40px}
.page{display:flex;flex-direction:column;gap:16px;max-width:1180px}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.head>div:first-child{flex:1;min-width:240px}
.eb{font:700 11.5px Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--warn)}
h1{font-size:30px;line-height:1.15;margin-top:4px;color:var(--cream)}
.lead{color:var(--muted);margin-top:4px}
.cap{font:700 11.5px Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sec{font-size:19px;padding-bottom:8px;margin-bottom:12px;border-bottom:1px solid rgba(76,129,134,.42)}
.mut{color:var(--muted)}.small{font-size:13px}
.card{background-color:var(--panel);background-image:linear-gradient(118deg,rgba(89,211,216,.03),transparent 30%,rgba(228,72,61,.02));border:1px solid var(--line);border-radius:9px;padding:16px 18px;min-width:0;box-shadow:0 12px 30px rgba(0,0,0,.16),inset 0 1px rgba(255,255,255,.025)}
.card h2{font-size:17px}
.stack{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.duo{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.btn{font-weight:700;font-size:14.5px;min-height:40px;padding:0 16px;border-radius:7px;border:1px solid rgba(71,111,116,.72);background:linear-gradient(180deg,rgba(25,34,37,.96),rgba(15,21,23,.96));color:#dce6e3;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{border-color:rgba(89,207,212,.62);background:#192528}
.btn.p{border-color:rgba(111,226,229,.32);background:linear-gradient(180deg,#62dce0 0%,#31abb4 100%);color:#061012;box-shadow:inset 0 1px rgba(255,255,255,.26),0 5px 16px rgba(42,170,179,.12)}
.btn.p:hover{filter:brightness(1.08)}
.btn.s{min-height:34px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer}
.btns{display:flex;gap:10px;flex-wrap:wrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{width:22px;height:22px;border-radius:50%;border:1px solid rgba(71,111,116,.72);background:#121a1d;color:var(--muted);font-weight:700;font-size:12px;cursor:pointer;display:inline-grid;place-items:center;padding:0;flex:none}
.q:hover,.q[aria-expanded="true"]{color:var(--accent);border-color:var(--accent)}
.tipw{position:relative;display:inline-flex;align-items:center;gap:8px}
.tip{position:absolute;z-index:20;top:30px;left:-10px;width:min(320px,80vw);background:#0e1a1c;border:1px solid rgba(91,213,218,.72);border-radius:8px;padding:12px 14px;font-size:13px;line-height:1.5;color:var(--text);box-shadow:0 14px 34px rgba(0,0,0,.6);font-weight:400}
.tip.r{left:auto;right:-10px}
.sw{width:46px;height:26px;border-radius:999px;border:0;padding:3px;cursor:pointer;display:flex;align-items:center;flex:none;background:#1c2629;justify-content:flex-start}
.sw span{width:20px;height:20px;border-radius:50%;display:block;background:var(--muted)}
.sw[aria-checked="true"]{background:linear-gradient(180deg,#62dce0,#31abb4);justify-content:flex-end}
.sw[aria-checked="true"] span{background:#061012}
.swl{font-size:13px;color:var(--muted)}
.row{display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--line2)}
.row:first-of-type{border-top:0}
.row .t{flex:1;min-width:0}
.pill{font-weight:700;font-size:12px;border-radius:999px;padding:2px 9px;white-space:nowrap;background:rgba(255,255,255,.06);color:var(--muted)}
.pill.team{color:var(--accent);background:rgba(89,211,216,.10)}
.pill.on{color:var(--ok);background:rgba(62,207,142,.12)}
.state{background-color:var(--panel);border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:9px;padding:11px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.state .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.state .sub{font-size:13px;color:var(--muted)}
.state .btn{align-self:flex-start;margin-top:6px}
.state.ok{border-left-color:var(--ok)}.state.wait{border-left-color:var(--warn)}.state.bad{border-left-color:var(--danger)}

.st{font-weight:700;font-size:13.5px;white-space:nowrap}.st.ok{color:var(--ok)}.st.wait{color:var(--warn)}.st.bad{color:var(--danger-text)}.st.idle{color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line2);font-size:14px}
.kv span{color:var(--muted)}.kv b{text-align:right}
.tile{background-color:var(--panel);border:1px solid var(--line);border-radius:9px;padding:13px 15px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:5px;min-width:0}
.tile:hover{border-color:rgba(90,205,211,.62);background-color:rgba(15,22,24,.96)}
.tile .top{display:flex;align-items:center;gap:8px;width:100%}.tile .top b{flex:1;min-width:0}
.met{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.met div{background:var(--panel2);border:1px solid rgba(255,255,255,.04);border-radius:7px;padding:6px 9px;min-width:0}
.met small{display:block;font-size:12px;color:var(--muted)}.met b{font-size:15px;font-variant-numeric:tabular-nums}
.prof.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.prof input[data-rename]{width:100%;background:transparent;border:1px solid transparent;border-radius:6px;padding:2px 6px;margin-left:-6px;font-weight:700;font-size:18px;color:var(--text)}
.prof input[data-rename]:hover,.prof input[data-rename]:focus{border-color:rgba(66,103,108,.72);background:rgba(15,22,24,.96)}
details summary{cursor:pointer;font-size:13px;color:var(--muted);margin-top:10px}
details label{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;padding:4px 0;overflow-wrap:anywhere}
details input[type="checkbox"]{flex:0 0 auto;width:14px;height:14px;margin:3px 0 0;accent-color:var(--accent)}
details label span{min-width:0}
.field{width:100%;background:rgba(15,22,24,.96);border:1px solid rgba(66,103,108,.72);border-radius:7px;padding:10px 12px;color:var(--text)}
.field:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px rgba(89,211,216,.09)}
.addr{display:flex;align-items:center;gap:10px;background:rgba(15,22,24,.96);border:1px solid rgba(66,103,108,.72);border-radius:7px;padding:6px 6px 6px 12px}
.addr b{flex:1;color:var(--accent);font-size:16px;word-break:break-all}
.pop{width:320px;max-width:100%;background:#0c1113;border:2px solid var(--accent);border-radius:12px;padding:14px 16px;box-shadow:0 0 22px rgba(0,0,0,.7);flex:none}
.pop .l{display:grid;grid-template-columns:1fr auto auto;font-size:15px}.pop .l i{font-style:normal;color:#5f6a6e;padding-right:6px}.pop .l b{color:var(--accent);text-align:right}
.note{color:var(--warn);font-size:13.5px}
.stepper{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.stepper .n{font-size:34px;font-weight:700;min-width:56px;text-align:center;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);max-width:min(560px,90vw);background:#0e1a1c;border:1px solid rgba(91,213,218,.72);border-radius:8px;padding:10px 14px;box-shadow:0 14px 34px rgba(0,0,0,.6);z-index:60}
.toast.bad{border-color:var(--danger)}
.shade{position:fixed;inset:0;background:rgba(3,5,6,.78);display:grid;place-items:center;z-index:50;padding:16px}
.dialog{width:min(640px,100%);max-height:100%;overflow-y:auto;background:#0c1113;border:1px solid rgba(73,118,123,.62);border-radius:10px;padding:24px 26px;display:flex;flex-direction:column;gap:16px;box-shadow:0 30px 80px rgba(0,0,0,.7)}
.steps{display:flex;gap:6px}.steps div{flex:1;display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:11.5px;color:var(--muted)}
.steps i{height:4px;border-radius:2px;background:#29454a}.steps .done i{background:var(--accent)}.steps .now{color:var(--text)}
.gm{display:flex;align-items:center;gap:12px;padding:6px 0}.gm>span{flex:1}
.foot{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line2);padding-top:14px}
.ghost{background:transparent!important;border-color:transparent!important;color:var(--muted)!important}
.empty{color:var(--muted);text-align:center;padding:30px}
/* The small update window (UpdateWindow.cs, ?fenetre=maj or installee): no banner, no menu. */
body.win .banner,body.win nav{display:none}
body.win main{padding:22px 26px 20px}
.wbox{display:flex;flex-direction:column;gap:16px;min-height:100%}
.wbox h1{font-size:26px;line-height:1.2;color:var(--cream);margin-top:6px}
.chg{display:flex;align-items:center;gap:12px;padding:11px 14px}
.chg b{color:var(--cream)}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;margin-right:6px;white-space:nowrap}
.tag.nouveau{background:rgba(89,211,216,.14);color:var(--accent)}.tag.mieux{background:rgba(231,182,83,.14);color:var(--warn)}.tag.corrige{background:rgba(238,243,242,.10);color:var(--text)}
.where{font-size:12.5px;color:var(--muted);margin-top:3px}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.duo{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  nav{width:64px;padding:14px 8px}
  nav .lb,nav .grp,nav .ver{display:none}
  nav .sep{display:block}
  .nv{justify-content:center;padding:0}
  .nv .dot{position:absolute;top:8px;right:10px}
  main{padding:20px 18px 30px}
  .g3,.two{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>
<body>
<div class="banner" role="img" aria-label="Endurance Manager"><i></i></div>
<div class="stripes" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="shell">
<nav aria-label="Menu du plugin" id="nav"></nav>
<main id="main"><p class="empty">Chargement…</p></main>
</div>
<div id="overlay"></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
'use strict';
// ── Icons (stroke, currentColor) ─────────────────────────────────────────────────────────────────────────────────
const ICON = {
  home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  relais: '<rect x="3" y="5" width="18" height="5" rx="1"/><path d="M3 15h18M3 19h11"/>',
  profils: '<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
  bb: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2"/><path d="M3.5 10h6.5M14 10h6.5M12 14v7"/>',
  mur: '<rect x="3" y="4" width="18" height="12" rx="1"/><path d="M8 20h8M12 16v4"/>',
  memo: '<path d="M3 20h18M6 16v-5M11 16V6M16 16v-8M20 16v-3"/>',
  equipe: '<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14c2.5.2 4.5 2.3 4.5 5"/>',
  dev: '<path d="M9 3h6M10 3v6l-5.2 9.3A1.8 1.8 0 0 0 6.4 21h11.2a1.8 1.8 0 0 0 1.6-2.7L14 9V3M7.5 15h9"/>',
  guide: '<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',
  souci: '<path d="M5 21V4M5 4h12l-2.5 4L17 12H5"/>',
  maj: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
};
const svg = (k) => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>`;

// ── The modules ──────────────────────────────────────────────────────────────────────────────────────────────────
const MOD = {
  relais: { name: 'Overlay relais', line: 'Ton relais par-dessus le jeu.', group: 'Pour moi', n: '01' },
  profils: { name: 'Réglages voiture en course', line: 'Un bouton du volant par profil.', group: 'Pour moi', n: '02' },
  bb: { name: 'Black box sur boutons', line: 'La black box sur ton volant.', group: 'Pour moi', n: '03' },
  mur: { name: 'Mur des stands', line: 'Sur un 2e écran ou une tablette.', group: 'Pour moi', n: '04' },
  memo: { name: 'Télémétrie Mémo', line: 'Tes tours dans les fiches de l’équipe.', group: 'Avec mon équipe', n: '01' },
  equipe: { name: 'Mur des stands équipages', line: 'Ta voiture en direct pour l’équipe.', group: 'Avec mon équipe', n: '02' },
  dev: { name: 'Aide au développement', line: 'Facultatif, aide à corriger le plugin.', group: 'Avec mon équipe', n: '03' },
};
const SOLO = ['relais', 'profils', 'bb', 'mur'], TEAM = ['memo', 'equipe', 'dev'];

// ── State ────────────────────────────────────────────────────────────────────────────────────────────────────────
let S = null, last = '';
const UI = { page: load('page') || 'home', tip: null, guide: false, step: 0 };
// #profils opens a page, #guide:2 the guide at a step (the pictures made by the CI, tests/Preview).
(() => { const [pg, st] = location.hash.slice(1).split(':'); if (pg === 'guide') { UI.guide = true; UI.step = +st || 0; UI.seenGuide = true; } else if (pg) { UI.page = pg; UI.seenGuide = true; } })();
// ?fenetre=maj / ?fenetre=installee: the small update window (UpdateWindow.cs).
const WIN = new URLSearchParams(location.search).get('fenetre');
if (WIN) { document.body.classList.add('win'); UI.seenGuide = true; }
function load(k) { try { return localStorage.getItem('em.' + k); } catch { return null; } }
function save(k, v) { try { localStorage.setItem('em.' + k, v); } catch {} }
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const $ = (id) => document.getElementById(id);

async function poll() {
  if (!document.hidden) {
    try {
      const r = await fetch('/etat', { headers: { 'X-EM': '1' }, cache: 'no-store' });
      if (r.ok) {
        const text = await r.text();
        if (text !== last) {
          last = text; S = JSON.parse(text);
          // « Voir » in the update window: this screen opens that page.
          if (!WIN && S.go) { if (UI.goN !== undefined && S.go.n !== UI.goN && S.go.page) { UI.page = S.go.page; save('page', UI.page); } UI.goN = S.go.n; }
          if (!S.guideDone && !UI.seenGuide) { UI.guide = true; UI.seenGuide = true; } render(); }
      }
    } catch {}
  }
  setTimeout(poll, 1500);
}

async function act(body, quiet) {
  try {
    const r = await fetch('/action', { method: 'POST', headers: { 'X-EM': '1', 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const a = await r.json();
    if (a.message && !quiet) toast(a.message, !a.ok);
    last = ''; // refresh right after
    return a;
  } catch { toast('Le plugin ne répond pas.', true); return { ok: false }; }
}

let toastTimer;
function toast(text, bad) {
  const t = $('toast');
  t.textContent = text; t.className = 'toast' + (bad ? ' bad' : ''); t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 5000);
}

// ── Building blocks ──────────────────────────────────────────────────────────────────────────────────────────────
const sw = (key, label) => `<button type="button" class="sw" role="switch" aria-checked="${!!S.modules[key]}" aria-label="${esc(label || MOD[key].name)}" data-module="${key}"><span></span></button>`;
const tip = (id, label, text, right) => `<button type="button" class="q" aria-label="${esc(label)}" aria-expanded="${UI.tip === id}" data-tip="${id}">?</button>` +
  (UI.tip === id ? `<div class="tip${right ? ' r' : ''}" role="note">${text}</div>` : '');
const head = (key, title, lead) => {
  const m = MOD[key];
  return `<div class="head"><div><div class="eb">${m.group} · ${m.n}</div><h1>${esc(title || m.name)}</h1>${lead ? `<p class="lead">${lead}</p>` : ''}</div>
    <span class="swl">${S.modules[key] ? 'Activé' : 'Coupé'}</span>${sw(key, 'Activer ' + m.name)}</div>`;
};
const plain = (eb, title, lead) => `<div class="head"><div><div class="eb">${eb}</div><h1>${esc(title)}</h1>${lead ? `<p class="lead">${lead}</p>` : ''}</div></div>`;
const stateCard = (title, sub, cls, text, extra) => `<div class="state ${cls}"><div class="top"><b>${esc(title)}</b><b class="st ${cls}">${cls === 'ok' ? '✓ ' : ''}${esc(text)}</b></div><div class="sub">${sub}</div>${extra || ''}</div>`;

// ── What a version changes (Update.cs, src/changements.json) ─────────────────────────────────────────────────────
const TAG = { nouveau: 'Nouveau', mieux: 'Mieux', corrige: 'Corrigé' };
const PLACE = { home: 'Accueil', guide: 'Assistance › Guide', souci: 'Assistance › Signaler un souci', maj: 'Assistance › Mises à jour' };
const where = (p) => (MOD[p] ? MOD[p].group + ' › ' + MOD[p].name : PLACE[p] || '');
const changeList = (list, see) => (list || []).map((c) => `<div class="card chg"><div style="flex:1;min-width:0"><div><span class="tag ${esc(c.type)}">${esc(TAG[c.type] || c.type)}</span><b>${esc(c.text)}</b></div>`
  + `${where(c.page) ? `<div class="where">${esc(where(c.page))}</div>` : ''}</div>${see && where(c.page) ? `<button type="button" class="btn s" data-see="${esc(c.page)}">Voir</button>` : ''}</div>`).join('');
const updateLabel = () => ({ telechargement: 'Téléchargement…', redemarrage: 'SimHub redémarre…' })[S.upd.phase] || 'Mettre à jour';

function renderWin() {
  if (WIN === 'installee' || !S.update) {
    const list = WIN === 'installee' ? S.installed || [] : [];
    return `<div class="wbox"><div><div class="eb">${WIN === 'installee' ? 'C’est fait' : 'Mise à jour'}</div><h1>Tu as la version ${esc(S.version)}</h1>${list.length ? '<p class="lead">Voici où trouver les nouveautés.</p>' : ''}</div>
      ${list.length ? `<div class="stack" style="gap:8px">${changeList(list, true)}</div>` : ''}<span style="flex:1"></span>
      <button type="button" class="btn p" data-later>OK</button><p class="mut small" style="text-align:center">Toujours dans Assistance › Mises à jour.</p></div>`;
  }
  const busy = !!S.upd.phase, track = S.game.state === 'ok';
  return `<div class="wbox"><div><div class="eb">Mise à jour</div><h1>Version ${esc(S.update)} disponible</h1><p class="lead">Tu as la ${esc(S.version)}.</p></div>
    ${S.upd.changes.length ? `<div class="stack" style="gap:8px"><div class="cap">Ce qui change</div>${changeList(S.upd.changes, false)}</div>` : ''}<span style="flex:1"></span>
    ${S.upd.error ? `<p class="note" role="alert">${esc(S.upd.error)}</p>` : track ? '<p class="note">Termine d’abord ta séance : la mise à jour redémarre SimHub.</p>' : ''}
    <div class="btns"><button type="button" class="btn p" style="flex:1" data-act="update" ${busy || track ? 'disabled' : ''}>${updateLabel()}</button><button type="button" class="btn" data-later ${busy ? 'disabled' : ''}>Plus tard</button></div>
    <p class="mut small" style="text-align:center">SimHub redémarre tout seul. Tes réglages sont gardés.</p></div>`;
}

// ── Menu ─────────────────────────────────────────────────────────────────────────────────────────────────────────
function renderNav() {
  const item = (k, name, dot) => `<button type="button" class="nv" data-go="${k}" aria-label="${esc(name)}" ${UI.page === k ? 'aria-current="page"' : ''}>${svg(k)}<span class="lb">${esc(name)}</span>${dot ? `<span class="dot${S.modules[k] ? ' on' : ''}"></span>` : ''}</button>`;
  $('nav').innerHTML = item('home', 'Accueil')
    + '<div class="grp">Pour moi</div><div class="sep"></div>' + SOLO.map((k) => item(k, MOD[k].name, true)).join('')
    + '<div class="grp">Avec mon équipe</div><div class="sep"></div>' + TEAM.map((k) => item(k, MOD[k].name, true)).join('')
    + '<div class="grp">Assistance</div><div class="sep"></div>' + item('guide', 'Guide') + item('souci', 'Signaler un souci') + item('maj', 'Mises à jour' + (S.update ? ' · nouvelle version' : ''))
    + `<div class="ver">Endurance Manager ${esc(S.build)}</div>`;
}

// ── Guide (first start) ──────────────────────────────────────────────────────────────────────────────────────────
function renderGuide() {
  if (!UI.guide) { $('overlay').innerHTML = ''; return; }
  const names = ['Bienvenue', 'Modules', 'Site', 'C’est prêt'], k = UI.step;
  const gm = (key) => `<div class="gm"><span><b>${MOD[key].name}</b> <span class="mut small">· ${esc(MOD[key].line)}</span></span>${sw(key)}</div>`;
  const on = Object.values(S.modules).filter(Boolean).length;
  const body = [
    `<div class="eb">Bienvenue</div><h2 id="g-t" style="font-size:26px;line-height:1.2">Tes outils LMU, dans SimHub</h2><p class="mut">Deux minutes pour choisir ce que tu veux. Tout marche sans le site ; le site ajoute ce qui se partage avec l’équipe.</p>`,
    `<h2 id="g-t" style="font-size:22px">Tes modules</h2><div class="cap" style="margin-top:6px">Pour moi</div>${SOLO.map(gm).join('')}<div class="cap" style="margin-top:8px">Avec mon équipe</div>${TEAM.map(gm).join('')}`,
    `<div class="eb">Facultatif</div><h2 id="g-t" style="font-size:22px">Relier le site de l’équipe</h2>`
      + (S.site.linked ? `<p style="color:var(--ok);font-weight:700">✓ Relié · ${esc(S.site.detail)}</p>` : `<p class="mut">Sur le site : Fiches combo, « Relier SimHub », « Créer mon code ». Reviens ici : le plugin le trouve tout seul, ou clique « Coller mon code ».</p>
        <div class="btns"><button type="button" class="btn p" data-act="paste">Coller mon code</button><button type="button" class="btn" data-site="/fiches-combo.html">Ouvrir le site</button></div>`),
    `<div class="eb">C’est prêt</div><h2 id="g-t" style="font-size:26px">${on} module${on > 1 ? 's' : ''} allumé${on > 1 ? 's' : ''}</h2><p class="mut">Tu retrouves tout dans le menu à gauche. Les « ? » expliquent chaque réglage.</p>`,
  ][k];
  $('overlay').innerHTML = `<div class="shade"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="g-t">
    <div class="steps">${names.map((n, i) => `<div class="${i <= k ? 'done' : ''} ${i === k ? 'now' : ''}"><i></i>${i + 1} · ${n}</div>`).join('')}</div>
    <div class="stack" style="gap:8px">${body}</div>
    <div class="foot"><button type="button" class="btn s ghost" data-gclose>Plus tard</button><span style="flex:1"></span>
      ${k > 0 ? '<button type="button" class="btn" data-gprev>Retour</button>' : ''}<button type="button" class="btn p" data-gnext>${k === 3 ? 'Terminer' : k === 2 && !S.site.linked ? 'Plus tard' : 'Suivant'}</button></div>
  </div></div>`;
}

// ── Render ───────────────────────────────────────────────────────────────────────────────────────────────────────
function render() {
  if (!S) return;
  if (WIN) { $('main').innerHTML = renderWin(); return; }
  if (!PAGES[UI.page]) UI.page = 'home';
  renderNav();
  // Never redrawn under the pilot's typing.
  const typing = document.activeElement && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName) && document.activeElement.type !== 'checkbox';
  if (!typing) $('main').innerHTML = PAGES[UI.page]();
  renderGuide();
}

document.addEventListener('click', async (e) => {
  const t = e.target.closest('button, input[type=checkbox]');
  if (!t) { if (UI.tip) { UI.tip = null; render(); } return; }
  const d = t.dataset;
  if (d.tip) { UI.tip = UI.tip === d.tip ? null : d.tip; render(); return; }
  if (UI.tip) UI.tip = null;
  if (d.later !== undefined) { act({ do: 'later' }, true); return; }
  if (d.see) { if (WIN) act({ do: 'see', page: d.see }, true); else { UI.page = d.see; save('page', d.see); render(); } return; }
  if (d.go) { UI.page = d.go; save('page', d.go); $('main').scrollTop = 0; render(); return; }
  if (d.module) { S.modules[d.module] = !S.modules[d.module]; render(); await act({ do: 'module', key: d.module, on: S.modules[d.module] }); return; }
  if (d.laps) { S.laps = Math.max(1, Math.min(60, S.laps + +d.laps)); render(); act({ do: 'laps', value: S.laps }, true); return; }
  if (d.memorise) { act({ do: 'memorise', i: +d.memorise }, true); toast('Mémorisation…'); return; }
  if (d.apply) { act({ do: 'apply', i: +d.apply }, true); return; }
  if (d.pit) { act({ do: 'pit', i: +d.pit, key: d.key, on: t.checked }, true); return; }
  if (d.site) { act({ do: 'site', path: d.site }); return; }
  if (d.record !== undefined) { S.recording = !S.recording; render(); act({ do: 'record', on: S.recording }, true); return; }
  if (d.signal !== undefined) { const a = await act({ do: 'signal', note: UI.note || '' }); if (a.ok) { UI.note = ''; const n = $('note'); if (n) n.value = ''; } return; }
  if (d.guide !== undefined) { UI.guide = true; UI.step = 0; render(); return; }
  if (d.gclose !== undefined) { UI.guide = false; render(); act({ do: 'guideDone' }, true); return; }
  if (d.gprev !== undefined) { UI.step = Math.max(0, UI.step - 1); render(); return; }
  if (d.gnext !== undefined) { if (UI.step === 3) { UI.guide = false; UI.page = 'home'; act({ do: 'guideDone' }, true); } else UI.step++; render(); return; }
  if (d.act) {
    const map = { wall: { do: 'wall', on: false }, wallFull: { do: 'wall', on: true } };
    act(map[d.act] || { do: d.act });
    if (d.act === 'copyWall') toast('Adresse copiée.');
  }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.rename !== undefined) act({ do: 'rename', i: +t.dataset.rename, name: t.value }, true);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.rename !== undefined) e.target.blur();
  if (e.key === 'Escape') { if (UI.tip) { UI.tip = null; render(); } }
});
// Left the field: the next reading redraws (never at once, the click that left it must reach its button).
document.addEventListener('focusout', () => { last = ''; });
document.addEventListener('input', (e) => { if (e.target.id === 'note') UI.note = e.target.value; });
document.addEventListener('visibilitychange', () => { if (!document.hidden) last = ''; });
poll();
</script>
</body>
</html>
