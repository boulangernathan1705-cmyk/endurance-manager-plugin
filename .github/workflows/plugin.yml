name: Plugin

# Compile le plugin sur une machine Windows de GitHub, sans SimHub : la façade de son API (reference/) remplace ses DLL,
# avec les mêmes signatures (vérifiées par ApiCheck). Rejoue les séances de tests/Replay/fixtures et les enregistrements
# de enregistrements/ dans le code du plugin, du jeu jusqu'au mur des stands. Joint le zip à chaque exécution.
# Sur main, une version nouvelle (<Version> de src/EnduranceManager.SimHub.csproj) devient une Release GitHub.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: plugin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Le dépôt du site (public) : son shared/live.mjs fait tourner le salon du mur dans le rejeu (tests/room-bridge.mjs).
  SITE_REPO: boulangernathan1705-cmyk/app-endurance-manager
  SITE_REF: dev

jobs:
  # PR fermée (fusionnée ou non) : sa pré-version « pr-N » part.
  nettoyage:
    name: zip de test retiré
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release delete "pr-${{ github.event.pull_request.number }}" --cleanup-tag --yes || true

  plugin:
    name: compilation et rejeu
    if: github.event.action != 'closed'
    runs-on: windows-latest
    timeout-minutes: 20
    # Write: the pictures of the plugin's screen go back on the pull request's branch, and releases on main.
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      REPLAY_OUT: ${{ github.workspace }}\replay-out
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SITE_REPO }}
          ref: ${{ env.SITE_REF }}
          path: site
          sparse-checkout: shared
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Compiler le plugin (façade SimHub)
        run: dotnet build src/EnduranceManager.SimHub.csproj -c Release -p:UseSimHubFacade=true

      - name: Vérifier l'API SimHub utilisée
        run: dotnet run --project reference/ApiCheck -c Release -- src/bin/Release/EnduranceManager.SimHub.dll

      - name: Rejouer les séances (moteur .NET Framework 4.8, celui de SimHub)
        run: dotnet run --project tests/Replay -c Release -f net48

      - name: Rejouer les enregistrements LMU
        run: |
          $files = Get-ChildItem enregistrements -Filter *.emrec -ErrorAction SilentlyContinue
          if (-not $files) { "Aucun enregistrement."; exit 0 }
          $failed = 0
          foreach ($f in $files) {
            "== $($f.Name)"
            dotnet run --project tests/Replay -c Release -f net48 --no-build -- rejouer $f.FullName
            if ($LASTEXITCODE -ne 0) { $failed++ }
          }
          if ($failed) { throw "$failed enregistrement(s) en erreur." }

      - name: Photos de l'écran du plugin (guide et onglets, thème du site)
        run: dotnet run --project tests/Preview -c Release -- "$env:GITHUB_WORKSPACE\apercus"

      - name: Préparer le zip
        id: zip
        run: |
          $version = ([xml](Get-Content src/EnduranceManager.SimHub.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          New-Item -ItemType Directory -Force zip | Out-Null
          Copy-Item src/bin/Release/EnduranceManager.SimHub.dll, "src/bin/Release/Installer le plugin.cmd", "src/bin/Release/Convertir un dash NeoRed.ps1" zip/
          # plugin.json for the site's update folder (/downloads/simhub/v0/, docs/publier.md): version, size, fingerprint
          # and « Ce qui change » from src/changements.json, which must be written for this very version.
          $notes = Get-Content src/changements.json -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($notes.version -ne $version) { "::error::src/changements.json est pour la $($notes.version), le plugin est en $version : écrire ses changements."; exit 1 }
          $dll = Get-Item zip/EnduranceManager.SimHub.dll
          [ordered]@{ version = $version; size = $dll.Length; sha256 = (Get-FileHash $dll -Algorithm SHA256).Hash; changes = @($notes.changes) } | ConvertTo-Json -Depth 5 | Set-Content zip/plugin.json -Encoding UTF8
          Compress-Archive -Path zip/* -DestinationPath "plugin-endurance-manager-$version.zip" -Force
          "### Plugin $version" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Zip prêt à essayer : « plugin-endurance-manager-$version » dans Artifacts, plus bas sur cette page." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Joindre le zip
        uses: actions/upload-artifact@v4
        with:
          name: plugin-endurance-manager-${{ steps.zip.outputs.version }}-${{ github.sha }}
          path: zip/*
          if-no-files-found: error
          retention-days: 30

      - name: Joindre les photos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apercus-${{ github.sha }}
          path: apercus/*.png
          if-no-files-found: ignore

      - name: Joindre les chiffres rejoués (dash, mur, séances)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rejeu-${{ github.sha }}
          path: |
            replay-out/*.mur.json
            replay-out/*.dash.json
            replay-out/*.sessions.json
          if-no-files-found: ignore
          retention-days: 14

      # Une PR : son zip en pré-version « pr-N » (remplacée à chaque envoi, supprimée à la fermeture de la PR), pour
      # l'essayer depuis Releases sans fouiller dans Actions. Jamais « latest » : les pilotes ne la voient pas.
      - name: Publier le zip de test de la PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.zip.outputs.version }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $tag = "pr-$env:PR"
          gh release delete $tag --cleanup-tag --yes *> $null
          $notes = "Zip de test de la PR #$env:PR (commit $($env:HEAD_SHA.Substring(0,7))), pas encore fusionnée. Dézipper, double-cliquer sur « Installer le plugin.cmd »."
          gh release create $tag "plugin-endurance-manager-$env:VERSION.zip" --target $env:HEAD_SHA --prerelease --latest=false --title "Test PR #$env:PR · $env:VERSION" --notes $notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "Zip de test aussi dans Releases : $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/tag/$tag" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      # Une version nouvelle sur main : une Release GitHub avec le zip (ce que les pilotes installent).
      - name: Publier la Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.zip.outputs.version }}
        run: |
          gh release view "v$env:VERSION" *> $null
          if ($LASTEXITCODE -eq 0) { "v$env:VERSION existe déjà : rien à publier (monter <Version> pour une nouvelle)."; exit 0 }
          gh release create "v$env:VERSION" "plugin-endurance-manager-$env:VERSION.zip" zip/plugin.json --target $env:GITHUB_SHA --title "Plugin $env:VERSION" --generate-notes
          exit $LASTEXITCODE

      # The pictures on the pull request's branch (maquettes/apercus-plugin), to look at without SimHub. [skip ci]: the
      # commit starts no new run.
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        with:
          ref: ${{ github.head_ref }}
          path: branche
      - name: Ranger les photos sur la branche
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        working-directory: branche
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          $to = "maquettes/apercus-plugin"
          New-Item -ItemType Directory -Force $to | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\apercus\*.png" $to -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $to
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { "Photos inchangées."; exit 0 }
          git commit -m "Photos de l'écran du plugin [skip ci]"
          git push origin "HEAD:refs/heads/$env:HEAD_REF"
