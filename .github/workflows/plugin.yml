name: Plugin

# Compile le plugin sur une machine Windows de GitHub, sans SimHub : la façade de son API (reference/) remplace ses DLL,
# avec les mêmes signatures (vérifiées par ApiCheck). Rejoue les séances de tests/Replay/fixtures et les enregistrements
# de enregistrements/ dans le code du plugin, du jeu jusqu'au mur des stands. Joint le zip à chaque exécution.
# Sur main, une version nouvelle (<Version> de src/EnduranceManager.SimHub.csproj) devient une Release GitHub.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: plugin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Le dépôt du site : son shared/live.mjs fait tourner le salon du mur dans le rejeu (tests/room-bridge.mjs).
  SITE_REPO: boulangernathan1705-cmyk/app-endurance-manager
  SITE_REF: dev

jobs:
  # Les pré-versions « pr-N » des PR fermées (fusionnées ou non) partent : à la fermeture, et à chaque passage sur main
  # (une fusion faite par une appli ne déclenche pas toujours l'événement « closed »).
  nettoyage:
    name: zips de test des PR fermées retirés
    if: (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for tag in $(gh release list --limit 100 --json tagName --jq '.[].tagName | select(startswith("pr-"))'); do
            state=$(gh pr view "${tag#pr-}" --json state --jq .state 2>/dev/null || echo CLOSED)
            if [ "$state" != "OPEN" ]; then gh release delete "$tag" --cleanup-tag --yes && echo "$tag retirée"; fi
          done

  plugin:
    name: compilation et rejeu
    if: github.event.action != 'closed'
    runs-on: windows-latest
    timeout-minutes: 20
    # Write: the pictures of the plugin's screen go back on the pull request's branch, and releases on main.
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      REPLAY_OUT: ${{ github.workspace }}\replay-out
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier l’accès CI au dépôt du site
        shell: pwsh
        env:
          SITE_READ_TOKEN: ${{ secrets.SITE_READ_TOKEN || secrets.SITE_TOKEN }}
        run: |
          if (-not $env:SITE_READ_TOKEN) { throw 'Configurer SITE_READ_TOKEN ou SITE_TOKEN pour le rejeu inter-dépôts.' }
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SITE_REPO }}
          token: ${{ secrets.SITE_READ_TOKEN || secrets.SITE_TOKEN }}
          persist-credentials: false
          ref: ${{ env.SITE_REF }}
          path: site
          sparse-checkout: shared
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Compiler le plugin (façade SimHub)
        run: dotnet build src/EnduranceManager.SimHub.csproj -c Release -p:UseSimHubFacade=true

      - name: Vérifier l'API SimHub utilisée
        run: dotnet run --project reference/ApiCheck -c Release -- src/bin/Release/EnduranceManager.SimHub.dll

      - name: Rejouer les séances (moteur .NET Framework 4.8, celui de SimHub)
        run: dotnet run --project tests/Replay -c Release -f net48

      - name: Rejouer les enregistrements LMU
        run: |
          $files = Get-ChildItem enregistrements -Filter *.emrec -ErrorAction SilentlyContinue
          if (-not $files) { "Aucun enregistrement."; exit 0 }
          $failed = 0
          foreach ($f in $files) {
            "== $($f.Name)"
            dotnet run --project tests/Replay -c Release -f net48 --no-build -- rejouer $f.FullName
            if ($LASTEXITCODE -ne 0) { $failed++ }
          }
          if ($failed) { throw "$failed enregistrement(s) en erreur." }

      - name: Photos de l'écran du plugin (guide et onglets, thème du site)
        run: dotnet run --project tests/Preview -c Release -- "$env:GITHUB_WORKSPACE\apercus"

      - name: Préparer le zip
        id: zip
        run: |
          $version = ([xml](Get-Content src/EnduranceManager.SimHub.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          New-Item -ItemType Directory -Force zip | Out-Null
          Copy-Item src/bin/Release/EnduranceManager.SimHub.dll, "src/bin/Release/Installer le plugin.cmd", "src/bin/Release/Convertir un dash NeoRed.ps1" zip/
          # plugin.json for the site's update folder (/downloads/simhub/v0/, docs/publier.md): version, size, fingerprint
          # and « Ce qui change » from src/changements.json, which must be written for this very version.
          $notes = Get-Content src/changements.json -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($notes.version -ne $version) { "::error::src/changements.json est pour la $($notes.version), le plugin est en $version : écrire ses changements."; exit 1 }
          $dll = Get-Item zip/EnduranceManager.SimHub.dll
          [ordered]@{ version = $version; size = $dll.Length; sha256 = (Get-FileHash $dll -Algorithm SHA256).Hash; changes = @($notes.changes) } | ConvertTo-Json -Depth 5 | Set-Content zip/plugin.json -Encoding UTF8
          Compress-Archive -Path zip/* -DestinationPath "plugin-endurance-manager-$version.zip" -Force
          "### Plugin $version" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Zip prêt à essayer : « plugin-endurance-manager-$version » dans Artifacts, plus bas sur cette page." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Joindre le zip
        uses: actions/upload-artifact@v4
        with:
          name: plugin-endurance-manager-${{ steps.zip.outputs.version }}-${{ github.sha }}
          path: zip/*
          if-no-files-found: error
          retention-days: 30

      - name: Joindre les photos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apercus-${{ github.sha }}
          path: apercus/*.png
          if-no-files-found: ignore

      - name: Joindre les chiffres rejoués (dash, mur, séances)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rejeu-${{ github.sha }}
          path: |
            replay-out/*.mur.json
            replay-out/*.dash.json
            replay-out/*.sessions.json
          if-no-files-found: ignore
          retention-days: 14

      # Une PR : son zip en pré-version « pr-N » (remplacée à chaque envoi, supprimée à la fermeture de la PR), pour
      # l'essayer depuis Releases sans fouiller dans Actions. Jamais « latest » : les pilotes ne la voient pas.
      - name: Publier le zip de test de la PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref != 'fix/memo-session-sync'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.zip.outputs.version }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $tag = "pr-$env:PR"
          gh release delete $tag --cleanup-tag --yes *> $null
          $notes = "Zip de test de la PR #$env:PR (commit $($env:HEAD_SHA.Substring(0,7))), pas encore fusionnée. Dézipper, double-cliquer sur « Installer le plugin.cmd »."
          gh release create $tag "plugin-endurance-manager-$env:VERSION.zip" --target $env:HEAD_SHA --prerelease --latest=false --title "Test PR #$env:PR · $env:VERSION" --notes $notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "Zip de test aussi dans Releases : $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/tag/$tag" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      # Une version nouvelle sur main : une Release GitHub avec le zip (ce que les pilotes installent).
      - name: Publier la Release
        # Aussi en lancement manuel sur main (Actions › Plugin › Run workflow) : une fusion faite par une appli ne
        # déclenche pas toujours la CI.
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.zip.outputs.version }}
        run: |
          gh release view "v$env:VERSION" *> $null
          if ($LASTEXITCODE -eq 0) { "v$env:VERSION existe déjà : rien à publier (monter <Version> pour une nouvelle)."; exit 0 }
          gh release create "v$env:VERSION" "plugin-endurance-manager-$env:VERSION.zip" zip/plugin.json --target $env:GITHUB_SHA --title "Plugin $env:VERSION" --generate-notes
          exit $LASTEXITCODE

      # Une version nouvelle sur main : la PR du site qui la sert aux plugins installés (docs/publier.md). Remplace
      # connectors/simhub-plugin/v0/ du site (DLL, plugin.json, installeur) sur une branche plugin-x.y.z vers dev.
      # Clone à part (RUNNER_TEMP) : site/ est déjà pris par le checkout du salon. Rien à faire si le dev du site l'a déjà ou si sa PR est ouverte. Demande le secret SITE_TOKEN (jeton GitHub
      # avec Contents et Pull requests en écriture sur le dépôt du site) ; sans lui, un avertissement et rien d'autre.
      - name: Proposer la version au site
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.SITE_TOKEN }}
          VERSION: ${{ steps.zip.outputs.version }}
        run: |
          if (-not $env:GH_TOKEN) { "::warning::Secret SITE_TOKEN absent : la PR du site n'est pas ouverte (docs/publier.md)."; exit 0 }
          $branch = "plugin-$env:VERSION"
          $served = gh api "repos/$env:SITE_REPO/contents/connectors/simhub-plugin/v0/plugin.json?ref=dev" --jq .content 2>$null
          if ($LASTEXITCODE -eq 0 -and $served) {
            $json = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($served -join ''))).TrimStart([char]0xFEFF) | ConvertFrom-Json
            if ($json.version -eq $env:VERSION) { "La $env:VERSION est déjà sur le dev du site."; exit 0 }
          }
          $open = gh pr list -R $env:SITE_REPO --head $branch --state open --json number --jq length
          if ($open -and $open -ne '0') { "PR du site déjà ouverte pour la $env:VERSION."; exit 0 }
          gh auth setup-git --hostname github.com
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git clone --depth 1 --branch dev "https://github.com/$env:SITE_REPO.git" "$env:RUNNER_TEMP/livraison"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $root = $env:GITHUB_WORKSPACE
          Set-Location "$env:RUNNER_TEMP/livraison"
          git checkout -b $branch
          $to = "connectors/simhub-plugin/v0"
          New-Item -ItemType Directory -Force $to | Out-Null
          Copy-Item "$root/zip/EnduranceManager.SimHub.dll", "$root/zip/plugin.json" $to -Force
          Copy-Item "$root/zip/Installer le plugin.cmd" "$to/installer.cmd" -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $to
          git commit -m "Plugin SimHub $env:VERSION servi aux plugins installés"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push --force origin "HEAD:refs/heads/$branch"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $notes = (Get-Content "$root/src/changements.json" -Raw -Encoding UTF8 | ConvertFrom-Json).changes | ForEach-Object { "- $($_.text)" }
          $body = "La Release $env:VERSION du plugin ($env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/tag/v$env:VERSION), dans connectors/simhub-plugin/v0/ : DLL, plugin.json tel quel, installeur. Ouverte toute seule par la CI du plugin.`n`nCe qui change :`n$($notes -join "`n")`n`nUne fois fusionnée dans dev puis en production, les plugins installés la proposent dans SimHub (/downloads/simhub/v0/) ; les anciens 2.x passent à la 0.x (/downloads/simhub/, annoncée 2.99.0)."
          gh pr create -R $env:SITE_REPO --base dev --head $branch --title "Plugin SimHub $env:VERSION" --body $body
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PR du site ouverte pour la $env:VERSION." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      # The pictures on the pull request's branch (maquettes/apercus-plugin), to look at without SimHub. [skip ci]: the
      # commit starts no new run.
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        with:
          ref: ${{ github.head_ref }}
          path: branche
      - name: Ranger les photos sur la branche
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        working-directory: branche
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          $to = "maquettes/apercus-plugin"
          New-Item -ItemType Directory -Force $to | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\apercus\*.png" $to -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $to
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { "Photos inchangées."; exit 0 }
          git commit -m "Photos de l'écran du plugin [skip ci]"
          git push origin "HEAD:refs/heads/$env:HEAD_REF"

  streamdeck:
    name: Générer et vérifier le profil Stream Deck
    needs: plugin
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cairosvg pillow
      - name: Générer le profil et son aperçu
        run: python streamdeck/build.py
      - name: Vérifier les dix valeurs électroniques
        run: |
          python - <<'PY'
          import json, zipfile
          from pathlib import Path
          expected = {'TC','CoupureTC','GlisseTC','ABS','Carto','Migration','AntiroulisAV','AntiroulisAR','Repartition','Regen'}
          with zipfile.ZipFile('streamdeck/Endurance Manager FMT.streamDeckProfile') as z:
              assert z.testzip() is None
              values = set()
              for name in z.namelist():
                  if not name.endswith('manifest.json'):
                      continue
                  manifest = json.loads(z.read(name))
                  for controller in manifest.get('Controllers', []):
                      for action in (controller.get('Actions') or {}).values():
                          for state in action.get('Settings', {}).get('StreamDeckButtonSetting', {}).get('States', []):
                              for label in state.get('RichLabel', []):
                                  expr = label.get('Formula', {}).get('Expression', '')
                                  prefix = '[EnduranceManagerPlugin.Voiture.Reglages.'
                                  if expr.startswith(prefix):
                                      values.add(expr[len(prefix):-1])
                          for state in action.get('States', []):
                              if state.get('Image'):
                                  assert str(Path(name).parent / state['Image']) in z.namelist()
              assert values == expected, (values, expected)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: streamdeck-profile-${{ github.sha }}
          path: |
            streamdeck/Endurance Manager FMT.streamDeckProfile
            streamdeck/apercu.png
      - name: Ranger le profil généré sur la branche
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'streamdeck/Endurance Manager FMT.streamDeckProfile' streamdeck/apercu.png
          git diff --cached --quiet && exit 0
          git commit -m 'Régénérer le profil Stream Deck [skip ci]'
          git push origin "HEAD:refs/heads/$HEAD_REF"
